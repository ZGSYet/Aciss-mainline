name: Evagelion

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'URL repo kernel'
        required: true
        default: "https://github.com/Aciss21/kernel_xiaomi_sm6150.git"
        type: string
      branch:
        description: "Branch"
        required: true
        default: "stable"
        type: string
        
      ksu:
        description: "KernelSU"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - Ksu

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Install Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev dwarves bc rsync cpio python3 python3-pip git curl wget make lz4 zip unzip ccache zstd
          sudo apt install -y fakeroot device-tree-compiler libdw-dev pkg-config lld llvm

      - name: 📥 Clone Kernel Source
        run: |
          git clone -q --depth=1 -b ${{ github.event.inputs.branch }} ${{ github.event.inputs.repo }} kernel

      - name: 🧩 Setup KernelSU
        if: ${{ github.event.inputs.ksu == 'Ksu' }}
        working-directory: kernel
        run: |
          curl -LSs "curl -LSs "https://raw.githubusercontent.com/manipvlator/KernelSU-Next/stable/kernel/setup.sh" | bash -s syscall" | bash -s syscall
                
      - name: 🔨 Build Kernel
        working-directory: kernel      
        run: |
          bash copyright
